<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SourceLack — Coming soon</title>
<meta name="description" content="Source all lack. A resource network built on abundance. Coming soon.">
<meta name="theme-color" content="#07201c">
<meta property="og:title" content="SourceLack — Coming soon">
<meta property="og:description" content="Source all lack. A resource network built on abundance.">
<meta property="og:type" content="website">
<style>
  :root{
    --sys:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --bg:#07201c;--panel:#0b2b25;--line:rgba(45,212,191,.18);
    --paper:#e8fbf4;--muted:#9fd0c4;--faint:#6f9c90;
    --teal:#2dd4bf;--coral:#ff7a66;--amber:#ffb26b;
    --grad:linear-gradient(100deg,#2dd4bf,#5fce9a 50%,#ff7a66);
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:var(--sys);background:var(--bg);color:var(--paper);line-height:1.55;-webkit-font-smoothing:antialiased;overflow:hidden}
  a{color:inherit;text-decoration:none}
  .grad-txt{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

  .stage{
    position:relative;min-height:100vh;min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:40px 24px;overflow:hidden;
    background:
      radial-gradient(72% 55% at 26% -6%,rgba(255,122,102,.22),transparent 60%),
      radial-gradient(80% 60% at 82% 108%,rgba(45,212,191,.2),transparent 60%),
      radial-gradient(120% 120% at 50% 42%,#0c322b,#07201c 82%);
  }
  #rain{position:absolute;inset:0;z-index:0;pointer-events:none}
  .vignette{position:absolute;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(58% 48% at 50% 46%,rgba(7,32,28,.82),rgba(7,32,28,.35) 62%,transparent 78%)}
  .inner{position:relative;z-index:2;max-width:760px}

  .brand{display:inline-flex;align-items:center;gap:12px;font-weight:800;letter-spacing:-.01em;font-size:19px;margin-bottom:34px}
  .brand .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
    background:linear-gradient(150deg,#2dd4bf,#3fb69a 50%,#ff7a66);
    box-shadow:0 8px 30px rgba(45,212,191,.28)}
  .brand .ic svg{width:66%;height:66%}

  .eyebrow{display:inline-block;font-size:12px;letter-spacing:.32em;text-transform:uppercase;font-weight:700;
    color:#bff0e5;padding:.5rem 1.05rem;border:1px solid var(--line);border-radius:100px;
    background:rgba(45,212,191,.06);margin-bottom:26px}
  .eyebrow .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--teal);
    margin-right:9px;vertical-align:middle;animation:blip 2.4s ease-in-out infinite}
  @keyframes blip{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(45,212,191,.5)}50%{opacity:.55;box-shadow:0 0 0 7px rgba(45,212,191,0)}}

  h1{font-size:clamp(46px,10vw,104px);line-height:.98;letter-spacing:-.03em;font-weight:800}
  p.lead{margin:24px auto 0;font-size:clamp(16px,2.1vw,21px);color:var(--muted);max-width:50ch}

  .chips{margin-top:38px;display:flex;flex-wrap:wrap;gap:9px;justify-content:center}
  .chip{font-size:13px;font-weight:600;color:var(--muted);padding:.5rem .95rem;border-radius:100px;
    border:1px solid var(--line);background:rgba(11,43,37,.5);backdrop-filter:blur(6px)}
  .chip .e{margin-right:7px}

  .foot{position:absolute;bottom:26px;left:0;right:0;z-index:2;
    color:var(--faint);font-size:12.5px;padding:0 24px}

  .reveal{opacity:0;transform:translateY(16px);animation:rise .8s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  .d1{animation-delay:.05s}.d2{animation-delay:.18s}.d3{animation-delay:.32s}.d4{animation-delay:.46s}.d5{animation-delay:.6s}
  @media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;animation:none}.eyebrow .dot{animation:none}}
</style>
</head>
<body>
<div class="stage">
  <canvas id="rain"></canvas>
  <div class="vignette"></div>

  <div class="inner">
    <div class="brand reveal d1">
      <span class="ic"><svg viewBox="0 0 100 100" fill="none"><g stroke="#fff" stroke-width="4" stroke-linecap="round"><line x1="50" y1="50" x2="80" y2="50"/><line x1="50" y1="50" x2="59.3" y2="21.5"/><line x1="50" y1="50" x2="25.7" y2="32.4"/><line x1="50" y1="50" x2="25.7" y2="67.6"/><line x1="50" y1="50" x2="59.3" y2="78.5"/></g><g fill="#fff"><circle cx="50" cy="50" r="8"/><circle cx="80" cy="50" r="5"/><circle cx="59.3" cy="21.5" r="5"/><circle cx="25.7" cy="32.4" r="5"/><circle cx="25.7" cy="67.6" r="5"/><circle cx="59.3" cy="78.5" r="5"/></g></svg></span>
      SourceLack
    </div>

    <div class="reveal d2"><span class="eyebrow"><span class="dot"></span>Coming soon</span></div>

    <h1 class="reveal d3">Source <span class="grad-txt">all lack.</span></h1>

    <p class="lead reveal d4">A network where what sits idle finds what's just out of reach. Food, tools, time, a ride, a hand. Abundance, by design.</p>

    <div class="chips reveal d5">
      <span class="chip"><span class="e">🍎</span>Food</span>
      <span class="chip"><span class="e">🏠</span>Housing</span>
      <span class="chip"><span class="e">🚗</span>Rides</span>
      <span class="chip"><span class="e">🎓</span>Skills</span>
      <span class="chip"><span class="e">🔧</span>Tools</span>
      <span class="chip"><span class="e">⏳</span>Time</span>
    </div>
  </div>

  <div class="foot">© 2026 Infinity Engine LLC · Powered by Infinity Engine</div>
</div>

<script>
(() => {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const c = document.getElementById('rain');
  if (!c || reduced) return;
  const x = c.getContext('2d');
  let W, H, DPR, ps = [];

  // money + resources, falling together
  const EMO = ['💵','🪙','💰','💸','🍎','🍞','🏠','🔧','🚗','🎓','⏳','⚡','💧','📦','🧰','🥫'];

  function size(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    const r = c.parentElement.getBoundingClientRect();
    W = r.width; H = r.height;
    c.width = W*DPR; c.height = H*DPR;
    c.style.width = W+'px'; c.style.height = H+'px';
    x.setTransform(DPR,0,0,DPR,0,0);

    const N = Math.min(34, Math.floor(W/44));
    ps = [];
    for (let i=0;i<N;i++){
      const depth = Math.random();               // 0 = far, 1 = near
      ps.push({
        x: Math.random()*W,
        y: Math.random()*H,
        vy: 0.22 + depth*0.75,
        s: 15 + depth*24,
        e: EMO[(Math.random()*EMO.length)|0],
        ph: Math.random()*6.28,
        sw: 6 + Math.random()*14,               // sway width
        rot: (Math.random()-0.5)*0.5,
        vr: (Math.random()-0.5)*0.012,
        a: 0.3 + depth*0.55
      });
    }
  }
  size();
  addEventListener('resize', size);

  function frame(){
    x.clearRect(0,0,W,H);
    for (const p of ps){
      p.y += p.vy;
      p.ph += 0.014;
      p.rot += p.vr;
      if (p.y - 40 > H){
        p.y = -40;
        p.x = Math.random()*W;
        p.e = EMO[(Math.random()*EMO.length)|0];
      }
      x.save();
      x.globalAlpha = p.a;
      x.translate(p.x + Math.sin(p.ph)*p.sw, p.y);
      x.rotate(Math.sin(p.ph*0.7)*0.18 + p.rot);
      x.font = p.s+'px serif';
      x.textAlign = 'center';
      x.textBaseline = 'middle';
      x.fillText(p.e, 0, 0);
      x.restore();
    }
    requestAnimationFrame(frame);
  }
  frame();
})();
</script>
</body>
</html>
